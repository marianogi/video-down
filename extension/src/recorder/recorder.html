<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>video-down · REC</title>
  <link rel="stylesheet" href="../ui/ui.css">
  <link rel="stylesheet" href="./recorder.css">
  <script type="module" src="./recorder.ts"></script>
</head>
<body>
  <div class="page">
    <header class="top">
      <div class="heading">
        <h1 id="title"></h1>
        <p id="meta" class="muted"></p>
      </div>
      <span id="state" class="chip" role="status"></span>
    </header>

    <section class="card">
      <div class="screen">
        <video id="player" controls playsinline></video>
        <p id="waiting" class="muted" data-i18n="recWaiting"></p>
      </div>
      <div class="actions">
        <button id="live" class="btn secondary" type="button" data-i18n="recGoLive" disabled></button>
        <span id="delay" class="muted" aria-live="polite"></span>
      </div>
    </section>

    <section class="card">
      <dl class="details">
        <dt data-i18n="recDuration"></dt><dd id="duration">0:00</dd>
        <dt data-i18n="recSize"></dt><dd id="size">0 B</dd>
        <dt data-i18n="recWhereLabel"></dt><dd data-i18n="recWhere"></dd>
      </dl>
      <label class="field">
        <span data-i18n="recNameLabel"></span>
        <input id="name" type="text" maxlength="180" spellcheck="false" autocomplete="off">
      </label>
      <p id="notice" class="notice" role="alert" hidden></p>
      <div class="actions">
        <button id="stop" class="btn" type="button" data-i18n="recStop"></button>
        <button id="save" class="btn" type="button" data-i18n="recSave" disabled></button>
        <button id="discard" class="btn secondary" type="button" data-i18n="recDiscard"></button>
      </div>
      <p class="saved-row"><span id="save-status" class="muted" aria-live="polite"></span>
        <button id="show" class="btn secondary" type="button" data-i18n="recShowFolder" hidden></button></p>
    </section>

    <p id="hint" class="muted"></p>
  </div>
</body>
</html>
